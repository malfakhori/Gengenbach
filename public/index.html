<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoVis AR Projekt</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-image: url('https://www.hft-stuttgart.de/fileadmin/Dateien/Hochschule/-_R_Juergen_Pollak_HFT_18.04.18-0091.jpg');
      background-size: cover;
      background-position: center;
    }

    .container {
      text-align: center;
      background-color: rgba(0, 0, 0, 0.5);
      padding: 50px;
      border-radius: 10px;
      color: white;
      max-width: 80%;
      box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 3em;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.2em;
      margin-bottom: 30px;
    }

    button {
      background-color: #4CAF50;
      color: white;
      font-size: 1.5em;
      padding: 15px 30px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s;
      margin: 10px;
    }

    button:hover {
      background-color: #45a049;
    }

    button:active {
      background-color: #387a39;
    }

    .menu-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      background-color: rgba(0, 0, 0, 0.7);
      padding: 10px;
      z-index: 10;
    }

    .menu-bar button {
      background-color: #2196F3;
    }

    .menu-bar button:hover {
      background-color: #1E88E5;
    }
  </style>

  <!-- Include Three.js and Three-Mesh-UI -->
  <script src="https://unpkg.com/three@0.126.0/build/three.js"></script>
  <script src="https://unpkg.com/three@0.126.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three-mesh-ui@3.4.0/dist/three-mesh-ui.min.js"></script>
</head>

<body>
  <script>
    let selectedModel = 'car'; // Standardauswahl
    let models = {};
    let reticle;
    let ui;

    async function activateXR() {
      const canvas = document.createElement('canvas');
      document.body.appendChild(canvas);
      const gl = canvas.getContext('webgl', { xrCompatible: true });
      const renderer = new THREE.WebGLRenderer({ alpha: true, canvas, context: gl });
      renderer.autoClear = false;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera();
      camera.matrixAutoUpdate = false;

      // Licht hinzufügen
      const light = new THREE.DirectionalLight(0xffffff, 1);
      light.position.set(10, 10, 10);
      scene.add(light);

      // Reticle (Cursor)
      const loader = new THREE.GLTFLoader();
      loader.load("https://immersive-web.github.io/webxr-samples/media/gltf/reticle/reticle.gltf", (gltf) => {
        reticle = gltf.scene;
        reticle.visible = false;
        scene.add(reticle);
      });

      // Modelle laden
      loader.load("https://threejs.org/examples/models/gltf/RobotExpressive/RobotExpressive.glb", (gltf) => {
        models.car = gltf.scene;
      });
      loader.load("https://immersive-web.github.io/webxr-samples/media/gltf/sunflower/sunflower.gltf", (gltf) => {
        models.lamp = gltf.scene;
      });

      // 3D UI mit three-mesh-ui erstellen
      ui = new ThreeMeshUI.Block({
        width: 0.4,
        height: 0.3,
        padding: 0.05,
        fontSize: 0.05,
        backgroundColor: new THREE.Color(0x333333),
        justifyContent: 'center',
        alignItems: 'center',
        borderRadius: 0.05
      });
      ui.position.set(0, -0.5, -1); // Vor der Kamera positionieren
      scene.add(ui);

      // AR-Session starten
      try {
        const session = await navigator.xr.requestSession('immersive-ar', { requiredFeatures: ['hit-test'] });
        session.updateRenderState({ baseLayer: new XRWebGLLayer(session, gl) });
        const referenceSpace = await session.requestReferenceSpace('local');
        const viewerSpace = await session.requestReferenceSpace('viewer');
        const hitTestSource = await session.requestHitTestSource({ space: viewerSpace });

        session.requestAnimationFrame(onXRFrame);

        session.addEventListener("select", (event) => {
          if (!reticle) return;

          // Modell platzieren, wenn kein Button angeklickt wurde
          if (models[selectedModel]) {
            const clone = models[selectedModel].clone();
            clone.position.copy(reticle.position);
            clone.scale.set(0.5, 0.5, 0.5); // Größe anpassen
            scene.add(clone);
            console.log(`${selectedModel} platziert`);
          }
        });

        function onXRFrame(time, frame) {
          session.requestAnimationFrame(onXRFrame);
          gl.bindFramebuffer(gl.FRAMEBUFFER, session.renderState.baseLayer.framebuffer);

          const pose = frame.getViewerPose(referenceSpace);
          if (pose) {
            const view = pose.views[0];
            const viewport = session.renderState.baseLayer.getViewport(view);
            renderer.setSize(viewport.width, viewport.height);

            camera.matrix.fromArray(view.transform.matrix);
            camera.projectionMatrix.fromArray(view.projectionMatrix);
            camera.updateMatrixWorld(true);

            // UI bleibt fixiert vor der Kamera
            ui.position.set(0, -0.5, -1);
            ui.lookAt(camera.position);

            const hitTestResults = frame.getHitTestResults(hitTestSource);
            if (hitTestResults.length > 0) {
              const hitPose = hitTestResults[0].getPose(referenceSpace);
              reticle.visible = true;
              reticle.position.set(hitPose.transform.position.x, hitPose.transform.position.y, hitPose.transform.position.z);
              reticle.updateMatrixWorld(true);
            }

            renderer.render(scene, camera);
          }
        }
      } catch (e) {
        console.error("AR-Session konnte nicht gestartet werden: ", e);
        alert("AR konnte nicht gestartet werden. Bitte sicherstellen, dass WebXR und AR auf deinem Gerät unterstützt werden.");
      }
    }

    // AR starten
    if (navigator.xr) {
      const startButton = document.createElement('button');
      startButton.textContent = 'Start AR';
      startButton.style.cssText = "position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 15px; font-size: 18px;";
      document.body.appendChild(startButton);
      startButton.onclick = () => {
        startButton.remove();
        activateXR();
      };
    } else {
      alert('WebXR wird von diesem Browser nicht unterstützt.');
    }
  </script>
</body>
</html>
