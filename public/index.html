<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoVis AR Projekt</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      color: #333;
      display: flex;
      height: 100vh;
    }

    /* Fixiertes Menü auf der linken Seite */
    .menu-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 200px;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      padding: 20px;
      box-sizing: border-box;
      z-index: 10;
    }

    .menu-bar button {
      background-color: #2196F3;
      width: 100%;
      padding: 15px;
      margin-bottom: 10px;
      color: white;
      font-size: 1.2em;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .menu-bar button:hover {
      background-color: #1E88E5;
    }

    .menu-bar button:active {
      background-color: #1976D2;
    }

    /* Der Hauptbereich für die AR-Ansicht */
    .main-content {
      flex-grow: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #e0e0e0;
    }

    h1 {
      font-size: 3em;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.2em;
      margin-bottom: 30px;
    }
  </style>
  <script src="https://unpkg.com/three@0.126.0/build/three.js"></script>
  <script src="https://unpkg.com/three@0.126.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
  <!-- Menü auf der linken Seite -->
  <div class="menu-bar">
    <button id="robotButton">RobotExpressive</button>
    <button id="sunflowerButton">Sunflower</button>
  </div>

  <!-- AR-Bereich -->
  <div class="main-content" id="arArea">
    <h1>AR Modell</h1>
    <p>Wählen Sie ein Modell aus dem Menü auf der linken Seite.</p>
  </div>

  <script>
    let selectedModel = 'robot'; // Standardauswahl
    let models = {};
    let reticle;
    let menu;

    async function activateXR() {
      const canvas = document.createElement('canvas');
      document.body.appendChild(canvas);
      const gl = canvas.getContext('webgl', { xrCompatible: true });
      const renderer = new THREE.WebGLRenderer({ alpha: true, canvas, context: gl });
      renderer.autoClear = false;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera();
      camera.matrixAutoUpdate = false;

      // Licht hinzufügen
      const light = new THREE.DirectionalLight(0xffffff, 1);
      light.position.set(10, 10, 10);
      scene.add(light);

      // Reticle (Cursor)
      const loader = new THREE.GLTFLoader();
      loader.load("https://immersive-web.github.io/webxr-samples/media/gltf/reticle/reticle.gltf", (gltf) => {
        reticle = gltf.scene;
        reticle.visible = false;
        scene.add(reticle);
      });

      // Modelle laden
      loader.load("https://threejs.org/examples/models/gltf/RobotExpressive/RobotExpressive.glb", (gltf) => {
        models.robot = gltf.scene;
      });
      loader.load("https://immersive-web.github.io/webxr-samples/media/gltf/sunflower/sunflower.gltf", (gltf) => {
        models.sunflower = gltf.scene;
      });

      // AR-Session starten
      const session = await navigator.xr.requestSession('immersive-ar', { requiredFeatures: ['hit-test'] });
      session.updateRenderState({ baseLayer: new XRWebGLLayer(session, gl) });
      const referenceSpace = await session.requestReferenceSpace('local');
      const viewerSpace = await session.requestReferenceSpace('viewer');
      const hitTestSource = await session.requestHitTestSource({ space: viewerSpace });

      session.requestAnimationFrame(onXRFrame);

      session.addEventListener("select", (event) => {
        if (!reticle) return;

        // Modelle platzieren
        if (models[selectedModel]) {
          const clone = models[selectedModel].clone();
          clone.position.copy(reticle.position);
          clone.scale.set(0.5, 0.5, 0.5); // Größe anpassen
          scene.add(clone);
          console.log(`${selectedModel} platziert`);
        }
      });

      // AR-Rendering
      function onXRFrame(time, frame) {
        session.requestAnimationFrame(onXRFrame);
        gl.bindFramebuffer(gl.FRAMEBUFFER, session.renderState.baseLayer.framebuffer);

        const pose = frame.getViewerPose(referenceSpace);
        if (pose) {
          const view = pose.views[0];
          const viewport = session.renderState.baseLayer.getViewport(view);
          renderer.setSize(viewport.width, viewport.height);

          camera.matrix.fromArray(view.transform.matrix);
          camera.projectionMatrix.fromArray(view.projectionMatrix);
          camera.updateMatrixWorld(true);

          // AR-Ansicht aktualisieren
          const hitTestResults = frame.getHitTestResults(hitTestSource);
          if (hitTestResults.length > 0) {
            const hitPose = hitTestResults[0].getPose(referenceSpace);
            reticle.visible = true;
            reticle.position.set(hitPose.transform.position.x, hitPose.transform.position.y, hitPose.transform.position.z);
            reticle.updateMatrixWorld(true);
          }

          renderer.render(scene, camera);
        }
      }
    }

    // AR starten
    if (navigator.xr) {
      const startButton = document.createElement('button');
      startButton.textContent = 'Start AR';
      startButton.style.cssText = "position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 15px; font-size: 18px;";
      document.body.appendChild(startButton);
      startButton.onclick = () => {
        startButton.remove();
        activateXR();
      };
    } else {
      alert('WebXR wird nicht unterstützt.');
    }

    // Button-Klicks zur Auswahl des Modells
    document.getElementById('robotButton').addEventListener('click', () => {
      selectedModel = 'robot';
      console.log('Robot ausgewählt');
    });

    document.getElementById('sunflowerButton').addEventListener('click', () => {
      selectedModel = 'sunflower';
      console.log('Sunflower ausgewählt');
    });
  </script>
</body>
</html>
