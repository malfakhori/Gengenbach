<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR mit Menüleiste</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      overflow: hidden;
      background-color: #000;
      color: white;
    }

    /* Der AR-Bereich: Reduziert durch Skalierung */
    #ar-container {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 80px; /* Platz für die Menüleiste */
      overflow: hidden;
      background-color: #000;
    }

    /* Menüleiste */
    #menu-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 80px;
      background-color: rgba(0, 0, 0, 0.8);
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 2px solid #333;
    }

    button {
      background-color: #2196F3;
      color: white;
      padding: 10px 20px;
      font-size: 18px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #1E88E5;
    }
  </style>
</head>
<body>
  <!-- Container für die AR-Ansicht -->
  <div id="ar-container"></div>

  <!-- Menüleiste -->
  <div id="menu-bar">
    <button onclick="setModel('car')">Auto</button>
    <button onclick="setModel('lamp')">Lampe</button>
  </div>

  <!-- Three.js & AR-Skripte -->
  <script src="https://unpkg.com/three@0.126.0/build/three.js"></script>
  <script src="https://unpkg.com/three@0.126.0/examples/js/loaders/GLTFLoader.js"></script>

  <script>
    let selectedModel = 'car';
    let models = {};
    let reticle;

    async function activateXR() {
      const container = document.getElementById('ar-container');

      const canvas = document.createElement('canvas');
      container.appendChild(canvas);

      const gl = canvas.getContext('webgl', { xrCompatible: true });
      const renderer = new THREE.WebGLRenderer({ alpha: true, canvas, context: gl });
      renderer.autoClear = false;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera();
      camera.matrixAutoUpdate = false;

      // Licht
      const light = new THREE.DirectionalLight(0xffffff, 1);
      light.position.set(10, 10, 10);
      scene.add(light);

      // GLTF-Loader für Modelle
      const loader = new THREE.GLTFLoader();
      loader.load("https://threejs.org/examples/models/gltf/RobotExpressive/RobotExpressive.glb", (gltf) => {
        models.car = gltf.scene;
      });
      loader.load("https://immersive-web.github.io/webxr-samples/media/gltf/sunflower/sunflower.gltf", (gltf) => {
        models.lamp = gltf.scene;
      });

      // Reticle (Cursor für Platzierung)
      loader.load("https://immersive-web.github.io/webxr-samples/media/gltf/reticle/reticle.gltf", (gltf) => {
        reticle = gltf.scene;
        reticle.visible = false;
        scene.add(reticle);
      });

      const session = await navigator.xr.requestSession('immersive-ar', { requiredFeatures: ['hit-test'] });
      session.updateRenderState({ baseLayer: new XRWebGLLayer(session, gl) });
      const referenceSpace = await session.requestReferenceSpace('local');
      const viewerSpace = await session.requestReferenceSpace('viewer');
      const hitTestSource = await session.requestHitTestSource({ space: viewerSpace });

      session.requestAnimationFrame(onXRFrame);

      session.addEventListener("select", () => {
        if (reticle && models[selectedModel]) {
          const clone = models[selectedModel].clone();
          clone.position.copy(reticle.position);
          scene.add(clone);
          console.log(`${selectedModel} platziert`);
        }
      });

      function onXRFrame(time, frame) {
        session.requestAnimationFrame(onXRFrame);
        gl.bindFramebuffer(gl.FRAMEBUFFER, session.renderState.baseLayer.framebuffer);

        const pose = frame.getViewerPose(referenceSpace);
        if (pose) {
          const view = pose.views[0];
          const viewport = session.renderState.baseLayer.getViewport(view);
          renderer.setSize(container.clientWidth, container.clientHeight);

          camera.matrix.fromArray(view.transform.matrix);
          camera.projectionMatrix.fromArray(view.projectionMatrix);
          camera.updateMatrixWorld(true);

          const hitTestResults = frame.getHitTestResults(hitTestSource);
          if (hitTestResults.length > 0) {
            const hitPose = hitTestResults[0].getPose(referenceSpace);
            reticle.visible = true;
            reticle.position.set(hitPose.transform.position.x, hitPose.transform.position.y, hitPose.transform.position.z);
          }

          renderer.render(scene, camera);
        }
      }
    }

    function setModel(model) {
      selectedModel = model;
      console.log(`${model} ausgewählt`);
    }

    if (navigator.xr) {
      const startButton = document.createElement('button');
      startButton.textContent = 'Start AR';
      startButton.style.cssText = "position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 100;";
      document.body.appendChild(startButton);
      startButton.onclick = () => {
        startButton.remove();
        activateXR();
      };
    } else {
      alert('WebXR wird nicht unterstützt.');
    }
  </script>
</body>
</html>
