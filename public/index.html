<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Kamera mit Menüleiste</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #000;
      color: #fff;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Container für die AR-Kamera */
    #camera-container {
      flex: 1; /* Nimmt den oberen Teil des Bildschirms ein */
      position: relative;
      background-color: #111;
    }

    /* Menüleiste unterhalb der Kamera */
    #menu-bar {
      height: 80px; /* Höhe der Menüleiste */
      background-color: rgba(0, 0, 0, 0.8);
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 2px solid #333;
    }

    button {
      background-color: #2196F3;
      color: #fff;
      font-size: 16px;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #1E88E5;
    }
  </style>
</head>
<body>
  <!-- AR-Kamera-Container -->
  <div id="camera-container"></div>

  <!-- Menüleiste -->
  <div id="menu-bar">
    <button onclick="selectModel('car')">Auto</button>
    <button onclick="selectModel('lamp')">Lampe</button>
  </div>

  <script src="https://unpkg.com/three@0.126.0/build/three.js"></script>
  <script src="https://unpkg.com/three@0.126.0/examples/js/loaders/GLTFLoader.js"></script>
  <script>
    let selectedModel = 'car';
    let models = {};

    async function activateXR() {
      const cameraContainer = document.getElementById('camera-container');

      // Renderer erstellen
      const renderer = new THREE.WebGLRenderer({ alpha: true });
      renderer.setSize(cameraContainer.clientWidth, cameraContainer.clientHeight);
      cameraContainer.appendChild(renderer.domElement);

      // Szene und Kamera erstellen
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(70, cameraContainer.clientWidth / cameraContainer.clientHeight, 0.01, 100);
      camera.position.z = 2;

      // Licht hinzufügen
      const light = new THREE.DirectionalLight(0xffffff, 1);
      light.position.set(10, 10, 10);
      scene.add(light);

      // Modelle laden
      const loader = new THREE.GLTFLoader();
      loader.load("https://threejs.org/examples/models/gltf/RobotExpressive/RobotExpressive.glb", (gltf) => {
        models.car = gltf.scene;
      });
      loader.load("https://immersive-web.github.io/webxr-samples/media/gltf/sunflower/sunflower.gltf", (gltf) => {
        models.lamp = gltf.scene;
      });

      // Animation
      function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
      }
      animate();

      // Dummy-Reticle (nur zur Demo)
      const reticleGeometry = new THREE.CircleGeometry(0.05, 32);
      const reticleMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000 });
      const reticle = new THREE.Mesh(reticleGeometry, reticleMaterial);
      reticle.position.set(0, -0.5, -2);
      scene.add(reticle);

      // Modell platzieren
      window.addEventListener('click', () => {
        if (models[selectedModel]) {
          const modelClone = models[selectedModel].clone();
          modelClone.position.set(0, -0.5, -2);
          modelClone.scale.set(0.5, 0.5, 0.5);
          scene.add(modelClone);
          console.log(`${selectedModel} platziert`);
        }
      });
    }

    // Modell auswählen
    function selectModel(model) {
      selectedModel = model;
      console.log(`${model} ausgewählt`);
    }

    // AR aktivieren
    activateXR();
  </script>
</body>
</html>
