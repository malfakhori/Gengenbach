<!doctype html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoVis AR Projekt</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-image: url('https://www.hft-stuttgart.de/fileadmin/Dateien/Hochschule/-_R_Juergen_Pollak_HFT_18.04.18-0091.jpg');
      background-size: cover;
      background-position: center;
    }

    .container {
      text-align: center;
      background-color: rgba(0, 0, 0, 0.5);
      padding: 50px;
      border-radius: 10px;
      color: white;
      max-width: 80%;
      box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 3em;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.2em;
      margin-bottom: 30px;
    }

    #menu-bar {
      position: absolute;
      bottom: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      color: white;
      display: none;
      justify-content: space-around;
      padding: 10px;
      z-index: 10;
    }

    .menu-item {
      cursor: pointer;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 5px;
      transition: background-color 0.3s;
    }

    .menu-item:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .menu-item.active {
      background: rgba(255, 255, 255, 0.5);
      font-weight: bold;
    }

    button {
      background-color: #4CAF50;
      color: white;
      font-size: 1.5em;
      padding: 15px 30px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s;
      margin: 10px;
    }

    button:hover {
      background-color: #45a049;
    }

    button:active {
      background-color: #387a39;
    }

    #confirmation-dialog {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 20;
    }

    .dialog-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
    }

    .dialog-box {
      position: relative;
      background: white;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
    }

    .dialog-box button {
      margin: 5px;
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .dialog-box button:first-child {
      background-color: #e74c3c;
      color: white;
    }

    .dialog-box button:last-child {
      background-color: #3498db;
      color: white;
    }
  </style>
  <script src="https://unpkg.com/three@0.126.0/build/three.js"></script>
  <script src="https://unpkg.com/three@0.126.0/examples/js/loaders/GLTFLoader.js"></script>
</head>

<body>
  <div id="menu-bar">
    <div class="menu-item active" id="robot-item" onclick="selectModel('robot')">
      <img src="previewImages/robot.png" alt="Roboter" style="width: 50px; height: 50px;">
    </div>
    <div class="menu-item" id="sunflower-item" onclick="selectModel('sunflower')">
      <img src="previewImages/sunflower.png" alt="Sonnenblume" style="width: 50px; height: 50px;">
    </div>
    <div class="menu-item" id="exit-item" onclick="exitAR()">
      <img src="previewImages/exit.png" alt="Exit" style="width: 50px; height: 50px;">
    </div>
  </div>
  <div id="confirmation-dialog" style="display: none;">
    <div class="dialog-overlay"></div>
    <div class="dialog-box">
      <p>Möchten Sie die AR-Session wirklich verlassen?</p>
      <button onclick="confirmExit(true)">Ja</button>
      <button onclick="confirmExit(false)">Nein</button>
    </div>
  </div>
  <script>
    let currentSession = null;
    // Restlicher Code siehe oben
  </script>
</body>

</html>
